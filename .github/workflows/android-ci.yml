name: Android CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Self-hosted Mac mini (Apple silicon) served by the runner-up pool.
    # Jobs run directly on the host, so one job == one emulator at a time.
    runs-on: finsight-android-mac
    timeout-minutes: 60
    env:
      JAVA_HOME: /Applications/Android Studio.app/Contents/jbr/Contents/Home
      CI_AVD: finsight_ci_api36
      # The CI emulator owns a fixed console port (adb serial emulator-<port>). This runner shares
      # one adb server with the captain's own emulators (finsight_api36 on 5554), so every adb call
      # below targets CI_EMULATOR_SERIAL explicitly and cleanup only ever touches that serial.
      CI_EMULATOR_PORT: "5580"
      CI_EMULATOR_SERIAL: emulator-5580
      SYSTEM_IMAGE: system-images;android-36;google_apis;arm64-v8a
    steps:
      - name: Set up machine toolchain paths
        run: |
          # Use the toolchains already installed on this Mac; nothing is downloaded.
          ANDROID_HOME="$HOME/Library/Android/sdk"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          {
            echo "$JAVA_HOME/bin"
            echo "$ANDROID_HOME/platform-tools"
            echo "$ANDROID_HOME/emulator"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
          } >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          java -version
          adb version
          emulator -version | head -n 1

      - name: Build debug APK and run unit tests
        run: bash gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Run Android Lint
        # Before the emulator steps so a lint failure fails fast.
        run: bash gradlew lintDebug --stacktrace

      - name: Build shrunk release APK (R8)
        # Builds the shipped release config (minify + resource shrinking) so an R8 or keep-rule break,
        # e.g. in the llama.cpp JNI bridge, fails here. -PciDebugSigning only signs with the
        # auto-generated debug key so the APK can be installed on the emulator below; no keystore or
        # secret is involved. Placed before the emulator steps so it fails fast.
        run: |
          bash gradlew assembleRelease -PciDebugSigning --stacktrace

          mapping_dir=app/build/outputs/mapping/release
          apk=app/build/outputs/apk/release/app-release.apk
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"

          # The JNI surface must survive shrinking under its original names (seeds.txt lists every
          # member matched by a keep rule). Native code binds/looks these up by name.
          for sym in \
            'com.example.finsightai.llm.LlamaNative: void nativeInit(java.lang.String)' \
            'com.example.finsightai.llm.LlamaNative: java.lang.String nativeSystemInfo()' \
            'com.example.finsightai.llm.LlamaNative: int nativeLoad(java.lang.String,int,long[])' \
            'com.example.finsightai.llm.LlamaNative: void nativeRelease(long)' \
            'com.example.finsightai.llm.LlamaNative: int nativeGenerate(' \
            'com.example.finsightai.llm.TokenSink: boolean onToken(byte[])'; do
            grep -qF -- "$sym" "$mapping_dir/seeds.txt" || { echo "::error::R8 did not keep JNI symbol: $sym"; exit 1; }
          done

          # Keep the APK for the on-emulator launch check (a later gradle run overwrites the output).
          cp "$apk" "$out/app-release.apk"
          bytes=$(stat -f%z "$apk")
          {
            echo "release_apk_bytes=$bytes"
            echo "release_apk_mib=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')"
            echo "mapping_txt_bytes=$(stat -f%z "$mapping_dir/mapping.txt")"
          } | tee "$out/apk-size.txt"
          {
            echo "### Shrunk release APK"
            echo "- Size: **$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }') MiB** ($bytes bytes), R8 + resource shrinking on, debug-signed for CI only"
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$mapping_dir/mapping.txt" "$mapping_dir/seeds.txt" "$mapping_dir/usage.txt" "$mapping_dir/configuration.txt" "$out/"

      - name: Prepare dedicated CI emulator (AVD)
        run: |
          # Never touch the captain's own emulators/AVDs: CI has its own AVD, port and serial.
          if ! emulator -list-avds | grep -qx "$CI_AVD"; then
            echo "Creating AVD $CI_AVD"
            echo no | avdmanager create avd --force -n "$CI_AVD" -k "$SYSTEM_IMAGE" -d pixel_7
          fi

          # Every later adb call and Gradle connected-test task targets only the CI emulator.
          echo "ANDROID_SERIAL=$CI_EMULATOR_SERIAL" >> "$GITHUB_ENV"

          # Free a CI emulator left over from a crashed run, and nothing else.
          adb start-server
          if adb devices | awk '{print $1}' | grep -qx "$CI_EMULATOR_SERIAL"; then
            avd_name=$(adb -s "$CI_EMULATOR_SERIAL" emu avd name 2>/dev/null | tr -d '\r' | head -n 1)
            if [ "$avd_name" != "$CI_AVD" ]; then
              echo "::error::$CI_EMULATOR_SERIAL is already in use by another emulator (AVD '${avd_name:-unknown}'); refusing to kill it. Free that port or change CI_EMULATOR_PORT."
              exit 1
            fi
            echo "Stopping leftover CI emulator $CI_EMULATOR_SERIAL"
            adb -s "$CI_EMULATOR_SERIAL" emu kill || true
          fi
          pkill -f "qemu-system.* -avd $CI_AVD( |\$)" || true

          # The emulator binds the console port and the adb port (console + 1); both must be free.
          deadline=$((SECONDS + 30))
          while lsof -nP -iTCP:"$CI_EMULATOR_PORT" -iTCP:"$((CI_EMULATOR_PORT + 1))" -sTCP:LISTEN >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::TCP port $CI_EMULATOR_PORT or $((CI_EMULATOR_PORT + 1)) is held by another process; refusing to kill it:"
              lsof -nP -iTCP:"$CI_EMULATOR_PORT" -iTCP:"$((CI_EMULATOR_PORT + 1))" -sTCP:LISTEN || true
              exit 1
            fi
            sleep 1
          done

      - name: Start emulator headless and wait for boot
        run: |
          mkdir -p "$RUNNER_TEMP/emulator"
          # -wipe-data + -no-snapshot-* => every run boots from a clean userdata.
          nohup emulator -avd "$CI_AVD" -port "$CI_EMULATOR_PORT" -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -gpu swiftshader_indirect -no-metrics \
            > "$RUNNER_TEMP/emulator/emulator.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/emulator/emulator.pid"

          timeout 120 adb -s "$CI_EMULATOR_SERIAL" wait-for-device
          deadline=$((SECONDS + 600))
          until [ "$(adb -s "$CI_EMULATOR_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Emulator did not finish booting within 10 minutes"
              tail -n 50 "$RUNNER_TEMP/emulator/emulator.log" || true
              exit 1
            fi
            sleep 5
          done
          echo "Emulator booted after ${SECONDS}s"

          # Settle, then disable animations to keep UI tests stable.
          adb -s "$CI_EMULATOR_SERIAL" shell input keyevent 82 || true
          adb -s "$CI_EMULATOR_SERIAL" shell settings put global window_animation_scale 0
          adb -s "$CI_EMULATOR_SERIAL" shell settings put global transition_animation_scale 0
          adb -s "$CI_EMULATOR_SERIAL" shell settings put global animator_duration_scale 0

      - name: Run instrumented tests
        # ANDROID_SERIAL (exported above) pins Gradle's connected-test tasks to the CI emulator.
        run: bash gradlew connectedDebugAndroidTest --stacktrace

      - name: Smoke-test shrunk release on emulator
        # Proves the R8-shrunk release APK runs: it launches, and every llama.cpp JNI entry point
        # resolves (no model download needed). A stripped or renamed JNI class fails here instead of
        # crashing users.
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          pkg=com.finsight.ai
          adb_ci() { adb -s "$CI_EMULATOR_SERIAL" "$@"; }

          # 1) Plain launch of the shrunk release APK, exactly as a user would start it.
          adb_ci uninstall "$pkg" >/dev/null 2>&1 || true
          adb_ci install -r "$RUNNER_TEMP/release/app-release.apk"
          adb_ci logcat -c
          adb_ci shell am start -W -n "$pkg/com.example.finsightai.MainActivity"
          sleep 8

          # adb can report the emulator "offline" for a moment after a clean launch (seen once, with
          # no crash). Wait for it to be back online, then retry pidof over a short bounded window
          # instead of failing on the first blip.
          running=0
          for attempt in 1 2 3 4 5 6; do
            timeout 30 adb -s "$CI_EMULATOR_SERIAL" wait-for-device || true
            if adb_ci shell pidof "$pkg"; then running=1; break; fi
            echo "pidof attempt $attempt/6: $pkg not found (or device not ready); retrying"
            sleep 5
          done
          timeout 30 adb -s "$CI_EMULATOR_SERIAL" wait-for-device || true
          adb_ci logcat -d > "$RUNNER_TEMP/release/launch-logcat.txt" || true
          if [ "$running" != "1" ]; then
            echo "::error::Shrunk release app is not running after launch"; exit 1
          fi
          if grep -E "FATAL EXCEPTION|UnsatisfiedLinkError|NoClassDefFoundError|ClassNotFoundException" "$RUNNER_TEMP/release/launch-logcat.txt"; then
            echo "::error::Crash while launching the shrunk release app"; exit 1
          fi
          adb_ci uninstall "$pkg"

          # 2) Real JNI calls against the shrunk release build (library load, backend init,
          #    system info, model load error path, generate/release entry points, TokenSink callback).
          #    ANDROID_SERIAL pins Gradle to the CI emulator.
          bash gradlew connectedReleaseAndroidTest -PciDebugSigning -PciReleaseTests \
            -Pandroid.testInstrumentationRunnerArguments.class=com.example.finsightai.llm.ReleaseShrinkSmokeTest \
            --stacktrace

      - name: Stop emulator
        if: always()
        run: |
          # Stop only the CI emulator (serial + AVD), never any other emulator on this shared adb server.
          if adb devices | awk '{print $1}' | grep -qx "$CI_EMULATOR_SERIAL"; then
            avd_name=$(adb -s "$CI_EMULATOR_SERIAL" emu avd name 2>/dev/null | tr -d '\r' | head -n 1)
            if [ "$avd_name" = "$CI_AVD" ]; then
              adb -s "$CI_EMULATOR_SERIAL" emu kill || true
            else
              echo "::warning::$CI_EMULATOR_SERIAL is not the CI emulator (AVD '${avd_name:-unknown}'); leaving it alone"
            fi
          fi
          if [ -f "$RUNNER_TEMP/emulator/emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/emulator/emulator.pid")" 2>/dev/null || true
          fi
          pkill -f "qemu-system.* -avd $CI_AVD( |\$)" || true
          true

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      - name: Upload release R8 mapping and APK size
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-r8-mapping-and-size
          path: |
            ${{ runner.temp }}/release/apk-size.txt
            ${{ runner.temp }}/release/mapping.txt
            ${{ runner.temp }}/release/seeds.txt
            ${{ runner.temp }}/release/usage.txt
            ${{ runner.temp }}/release/configuration.txt
            ${{ runner.temp }}/release/launch-logcat.txt
            app/build/reports/androidTests/connected/release
          if-no-files-found: warn

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/outputs/connected_android_test_additional_output
          if-no-files-found: warn

      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log
          path: ${{ runner.temp }}/emulator/emulator.log
          if-no-files-found: ignore
