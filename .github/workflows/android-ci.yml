name: Android CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Self-hosted Mac mini (Apple silicon) served by the runner-up pool.
    # Jobs run directly on the host, so one job == one emulator at a time.
    runs-on: finsight-android-mac
    timeout-minutes: 60
    env:
      JAVA_HOME: /Applications/Android Studio.app/Contents/jbr/Contents/Home
      CI_AVD: finsight_ci_api36
      SYSTEM_IMAGE: system-images;android-36;google_apis;arm64-v8a
    steps:
      - name: Set up machine toolchain paths
        run: |
          # Use the toolchains already installed on this Mac; nothing is downloaded.
          ANDROID_HOME="$HOME/Library/Android/sdk"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          {
            echo "$JAVA_HOME/bin"
            echo "$ANDROID_HOME/platform-tools"
            echo "$ANDROID_HOME/emulator"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
          } >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          java -version
          adb version
          emulator -version | head -n 1

      - name: Build debug APK and run unit tests
        run: bash gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Run Android Lint
        # Before the emulator steps so a lint failure fails fast.
        run: bash gradlew lintDebug --stacktrace

      - name: Prepare dedicated CI emulator (AVD)
        run: |
          # Never touch the captain's own finsight_api36 AVD: CI has its own.
          if ! emulator -list-avds | grep -qx "$CI_AVD"; then
            echo "Creating AVD $CI_AVD"
            echo no | avdmanager create avd --force -n "$CI_AVD" -k "$SYSTEM_IMAGE" -d pixel_7
          fi
          # Free any emulator left over from a crashed run so two never overlap.
          adb start-server
          adb devices | awk '/^emulator-/ {print $1}' | while read -r serial; do
            adb -s "$serial" emu kill || true
          done
          pkill -f "qemu-system.*-avd $CI_AVD" || true

      - name: Start emulator headless and wait for boot
        run: |
          mkdir -p "$RUNNER_TEMP/emulator"
          # -wipe-data + -no-snapshot-* => every run boots from a clean userdata.
          nohup emulator -avd "$CI_AVD" -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -gpu swiftshader_indirect -no-metrics \
            > "$RUNNER_TEMP/emulator/emulator.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/emulator/emulator.pid"

          timeout 120 adb wait-for-device
          deadline=$((SECONDS + 600))
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Emulator did not finish booting within 10 minutes"
              tail -n 50 "$RUNNER_TEMP/emulator/emulator.log" || true
              exit 1
            fi
            sleep 5
          done
          echo "Emulator booted after ${SECONDS}s"

          # Settle, then disable animations to keep UI tests stable.
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run instrumented tests
        run: bash gradlew connectedDebugAndroidTest --stacktrace

      - name: Stop emulator
        if: always()
        run: |
          adb devices | awk '/^emulator-/ {print $1}' | while read -r serial; do
            adb -s "$serial" emu kill || true
          done
          if [ -f "$RUNNER_TEMP/emulator/emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/emulator/emulator.pid")" 2>/dev/null || true
          fi
          pkill -f "qemu-system.*-avd $CI_AVD" || true
          true

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/outputs/connected_android_test_additional_output
          if-no-files-found: warn

      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log
          path: ${{ runner.temp }}/emulator/emulator.log
          if-no-files-found: ignore
